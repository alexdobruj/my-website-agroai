<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Реєстрація аграріїв — AgroAI Holding</title>
  <meta name="description" content="Зареєструйте господарство в базі аграріїв AgroAI: доступ до покупців з ЄС, маркетплейсів і закритого B2B-майданчика.">
  <link rel="alternate" hreflang="uk" href="/join">
  <link rel="alternate" hreflang="en" href="/en/join">
  <link rel="alternate" hreflang="x-default" href="/join">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header id="site-header"></header>

<main class="section">
  <div class="container" style="max-width:920px">
    <div class="section-head">
      <span class="eyebrow">База аграріїв</span>
      <h1 style="font-size:clamp(1.8rem,3.5vw,2.6rem)">Реєстрація господарства</h1>
      <p class="lead">Після перевірки ваші пропозиції з'являться на закритому майданчику для оптових покупців. Ваших контактів покупці не бачать — усі запити йдуть через нас.</p>
    </div>

    <form id="farmer-form" class="form">
      <input type="hidden" name="country" value="Україна">
      <fieldset>
        <legend>Господарство</legend>
        <div class="form">
          <div class="form-row">
            <div><label for="f-company">Назва господарства / компанії *</label><input id="f-company" name="company" required maxlength="150"></div>
            <div><label for="f-contact">Контактна особа *</label><input id="f-contact" name="contactName" required maxlength="100"></div>
          </div>
          <div class="form-row">
            <div><label for="f-email">Email *</label><input id="f-email" name="email" type="email" required maxlength="150"></div>
            <div><label for="f-phone">Телефон / Viber / WhatsApp</label><input id="f-phone" name="phone" maxlength="40"></div>
          </div>
          <div class="form-row">
            <div>
              <label for="f-region">Область</label>
              <select id="f-region" name="region" data-regions><option value="">— оберіть —</option></select>
            </div>
            <div><label for="f-ha">Площа, га</label><input id="f-ha" name="hectares" type="number" min="0"></div>
          </div>
          <div class="form-row">
            <div>
              <label for="f-export">Досвід експорту</label>
              <select id="f-export" name="exportExperience">
                <option value="none">Немає</option>
                <option value="some">Були разові поставки</option>
                <option value="regular">Експортуємо регулярно</option>
              </select>
            </div>
            <div>
              <label for="f-erp">Як ведете облік</label>
              <select id="f-erp" name="hasErp">
                <option value="none">У зошиті / в голові</option>
                <option value="excel">Excel / Google-таблиці</option>
                <option value="erp">Облікова або ERP-система</option>
              </select>
            </div>
          </div>
          <div>
            <label>Сертифікати</label>
            <div class="checks">
              <label><input type="checkbox" name="certifications" value="globalgap"> GlobalG.A.P.</label>
              <label><input type="checkbox" name="certifications" value="organic"> Organic (ЄС)</label>
              <label><input type="checkbox" name="certifications" value="haccp"> HACCP</label>
              <label><input type="checkbox" name="certifications" value="iso22000"> ISO 22000</label>
              <label><input type="checkbox" name="certifications" value="brc"> BRC</label>
              <label><input type="checkbox" name="certifications" value="ifs"> IFS</label>
              <label><input type="checkbox" name="certifications" value="halal"> Halal</label>
              <label><input type="checkbox" name="certifications" value="kosher"> Kosher</label>
              <label><input type="checkbox" name="certifications" value="fda"> Реєстрація FDA</label>
            </div>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Продукція</legend>
        <div id="products"></div>
        <button type="button" class="btn btn-ghost btn-sm" id="add-product">+ Додати продукт</button>
      </fieldset>

      <fieldset>
        <legend>Що вас цікавить</legend>
        <div class="checks">
          <label><input type="checkbox" name="goals" value="export"> Експорт у ЄС / світ</label>
          <label><input type="checkbox" name="goals" value="marketplaces"> Продажі на Amazon / маркетплейсах</label>
          <label><input type="checkbox" name="goals" value="b2b"> Оптові покупці</label>
          <label><input type="checkbox" name="goals" value="erp"> Впровадження обліку / ERP</label>
          <label><input type="checkbox" name="goals" value="certification"> Сертифікація</label>
          <label><input type="checkbox" name="goals" value="financing"> Фінансування / гранти</label>
        </div>
        <div style="margin-top:16px"><label for="f-comment">Коментар</label><textarea id="f-comment" name="comment" maxlength="2000"></textarea></div>
      </fieldset>

      <div class="checks"><label><input type="checkbox" name="consent" required> Погоджуюся на обробку персональних даних для підбору покупців і зв'язку зі мною *</label></div>
      <button class="btn btn-primary" type="submit">Надіслати анкету</button>
      <div class="form-msg" role="status"></div>
    </form>
  </div>
</main>

<template id="product-tpl">
  <div class="product-row">
    <div><label>Продукт *</label><input name="product" maxlength="100" placeholder="напр. волоський горіх"></div>
    <div>
      <label>Категорія</label>
      <select name="category">
        <option value="grain">Зернові</option>
        <option value="oilseeds">Олійні</option>
        <option value="fruits">Фрукти, ягоди</option>
        <option value="vegetables">Овочі</option>
        <option value="nuts">Горіхи</option>
        <option value="dried">Сухофрукти</option>
        <option value="honey">Мед</option>
        <option value="oil">Олія</option>
        <option value="wine">Вино</option>
        <option value="processed">Переробка (консерви, соки…)</option>
        <option value="other">Інше</option>
      </select>
    </div>
    <div><label>Обсяг / рік</label><input name="volume" type="number" min="0" step="any"></div>
    <div>
      <label>Од.</label>
      <select name="unit"><option value="t">т</option><option value="kg">кг</option><option value="l">л</option><option value="pcs">шт</option></select>
    </div>
    <div><label>Сезон</label><input name="season" maxlength="60" placeholder="вер–лис"></div>
    <button type="button" class="remove" title="Видалити">✕</button>
  </div>
</template>

<footer id="site-footer"></footer>
<script src="/js/main.js"></script>
<script src="/js/join.js"></script>
</body>
</html>
